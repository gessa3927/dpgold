<!-- 한국대표금거래소 메인 '금·은 시세 안내' (아임웹 코드 위젯용, 매시간 자동 갱신) -->
<div class="kdgp">
  <div class="kdgp-left">
    <div class="kdgp-brand">한국대표금거래소</div>
    <div class="kdgp-title">금·은 시세 안내</div>
    <div class="kdgp-unit">단위: 3.75g (자사골드바 기준)</div>
    <div class="kdgp-date" id="kdgp-date"></div>
  </div>
  <div class="kdgp-right">
    <div class="kdgp-scroll">
      <table class="kdgp-table">
        <thead>
          <tr>
            <th></th>
            <th>24k 순금시세</th>
            <th>18k 금시세</th>
            <th>14k 금시세</th>
            <th>백금<br>(platinum)</th>
            <th>순은(silver)</th>
          </tr>
        </thead>
        <tbody>
          <tr id="kdgp-sell"><td class="kdgp-rowh">내가 살 때<span class="kdgp-vat">(VAT포함)</span></td></tr>
          <tr id="kdgp-buy"><td class="kdgp-rowh">내가 팔 때</td></tr>
        </tbody>
      </table>
    </div>
    <div class="kdgp-note" id="kdgp-note"></div>
  </div>
</div>

<style>
.kdgp{display:flex;gap:40px;align-items:flex-start;max-width:1200px;margin:0 auto;padding:10px 20px;font-family:'Noto Sans KR','Pretendard',sans-serif;color:#1d2a4d;box-sizing:border-box}
.kdgp *{box-sizing:border-box}
.kdgp-left{flex:0 0 200px;padding-top:6px}
.kdgp-brand{font-size:13px;color:#555;margin-bottom:4px}
.kdgp-title{font-size:24px;font-weight:800;color:#1d2a4d;letter-spacing:-0.5px;margin-bottom:10px}
.kdgp-unit{font-size:11px;color:#777;margin-bottom:4px}
.kdgp-date{font-size:12px;font-weight:700;color:#b08a3e}
.kdgp-right{flex:1;min-width:0}
.kdgp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.kdgp-table{width:100%;min-width:640px;border-collapse:collapse;table-layout:fixed}
.kdgp-table th{font-family:'Noto Serif KR',serif;font-weight:500;font-size:15px;color:#333;padding:10px 8px 18px;text-align:center;line-height:1.35;border-bottom:1px solid #e6e6e6}
.kdgp-table th:first-child{width:90px}
.kdgp-table td{text-align:center;padding:18px 8px;border-bottom:1px solid #eee;vertical-align:middle}
.kdgp-table tr:last-child td{border-bottom:1px solid #e6e6e6}
.kdgp-rowh{font-size:14px;color:#444;font-weight:500}
.kdgp-vat{display:block;font-size:11px;color:#888;font-weight:400;margin-top:3px}
.kdgp-val{display:block;font-size:19px;font-weight:700;color:#1d2a4d;font-variant-numeric:tabular-nums}
.kdgp-txt{display:block;font-size:17px;font-weight:600;color:#1d2a4d;line-height:1.3}
.kdgp-chg{display:block;font-size:11px;margin-top:4px}
.kdgp-chg.up{color:#c0392b}.kdgp-chg.down{color:#2456b8}.kdgp-chg.flat{color:#999}
.kdgp-note{font-size:11px;color:#888;text-align:right;padding:10px 4px 0}
@media (max-width:768px){
  .kdgp{flex-direction:column;gap:14px;padding:10px 14px}
  .kdgp-left{flex:none}
  .kdgp-title{font-size:20px;margin-bottom:6px}
  .kdgp-table th{font-size:13px}
  .kdgp-val{font-size:16px}
  .kdgp-txt{font-size:14px}
  .kdgp-note{text-align:left}
}
</style>

<script>
(function(){
  var DATA_URL = 'https://raw.githubusercontent.com/gessa3927/dpgold/main/prices.json';

  // 불러오기 실패 시 표시할 기본값 (2026-11-25 16:53 기준)
  var FALLBACK = {"updated":"2026-11-25 16:53","items":[
    {"name":"순금","sell":665000,"sellChg":-22000,"buy":583000,"buyChg":-18000},
    {"name":"18K","sell":null,"sellText":"제품시세적용","buy":427800,"buyChg":-13300},
    {"name":"14K","sell":null,"sellText":"제품시세적용","buy":332100,"buyChg":-10300},
    {"name":"백금","sell":236100,"sellChg":-9000,"buy":192800,"buyChg":-7000},
    {"name":"은","sell":7160,"sellChg":-450,"buy":6340,"buyChg":-380}]};

  function won(n){return Number(n).toLocaleString('ko-KR');}
  function cell(v,c,text){
    if(v==null) return '<td><span class="kdgp-txt">'+(text||'-')+'</span></td>';
    var h='<td><span class="kdgp-val">'+won(v)+'</span>';
    if(c!=null){
      var prev=v-c, pct=prev?Math.abs(c/prev*100).toFixed(2):'0.00';
      var cls=c>0?'up':(c<0?'down':'flat'), sym=c>0?'▲':(c<0?'▼':'-');
      h+='<span class="kdgp-chg '+cls+'">'+sym+' '+won(Math.abs(c))+' ('+pct+'%)</span>';
    }
    return h+'</td>';
  }
  function render(d){
    var sell=document.getElementById('kdgp-sell'), buy=document.getElementById('kdgp-buy');
    var sh='<td class="kdgp-rowh">내가 살 때<span class="kdgp-vat">(VAT포함)</span></td>', bh='<td class="kdgp-rowh">내가 팔 때</td>';
    d.items.forEach(function(it){ sh+=cell(it.sell,it.sellChg,it.sellText); bh+=cell(it.buy,it.buyChg,it.buyText); });
    sell.innerHTML=sh; buy.innerHTML=bh;
    var u=d.updated||''; var m=u.match(/(\d{4})-(\d{2})-(\d{2})\s*(\d{2}:\d{2})?/);
    document.getElementById('kdgp-date').textContent = m ? (m[1]+'-'+m[2]+'-'+m[3]+(m[4]?' '+m[4]:'')) : u;
    document.getElementById('kdgp-note').textContent = m
      ? '표시된 금액은 '+m[1]+'년 '+Number(m[2])+'월 '+Number(m[3])+'일 '+(m[4]||'')+' 기준입니다. 현재 구매·매입 금액은 상담을 통해 확인해 주세요.'
      : '현재 구매·매입 금액은 상담을 통해 확인해 주세요.';
  }
  render(FALLBACK);
  fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(render).catch(function(){});
})();
</script>
